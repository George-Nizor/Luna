[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luna"
version = "0.3.0"
description = "Local-only Qwen3-TTS voice studio"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["data", "runtime", "logs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
